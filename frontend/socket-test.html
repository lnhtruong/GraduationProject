<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socket.IO Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to right, #1e3c72, #2a5298);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            padding: 30px;
            max-width: 600px;
            width: 100%;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }
        .config-section {
            margin-bottom: 25px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 5px;
        }
        .config-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        label {
            display: block;
            font-weight: 600;
            color: #555;
            margin-bottom: 5px;
        }
        input[type="text"],
        input[type="password"] {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            width: 100%;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }
        .btn-connect {
            background: #4CAF50;
            color: white;
            width: 100%;
            margin-bottom: 10px;
        }
        .btn-connect:hover {
            background: #45a049;
        }
        .btn-connect:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .btn-disconnect {
            background: #f44336;
            color: white;
            width: 100%;
        }
        .btn-disconnect:hover {
            background: #da190b;
        }
        .status {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 15px 0;
            padding: 10px;
            border-radius: 4px;
            font-weight: 600;
        }
        .status.connected {
            background: #e8f5e9;
            color: #2e7d32;
        }
        .status.disconnected {
            background: #ffebee;
            color: #c62828;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }
        .status.connected .status-dot {
            background: #4CAF50;
        }
        .status.disconnected .status-dot {
            background: #f44336;
        }
        .message-section {
            margin-top: 25px;
        }
        .message-input {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .message-input input {
            flex: 1;
        }
        .btn-send {
            background: #2196F3;
            color: white;
            padding: 8px 16px;
        }
        .btn-send:hover {
            background: #0b7dda;
        }
        .messages {
            border: 1px solid #ddd;
            border-radius: 4px;
            height: 300px;
            overflow-y: auto;
            padding: 15px;
            background: #fafafa;
            font-size: 13px;
            font-family: 'Courier New', monospace;
        }
        .message-item {
            margin-bottom: 10px;
            padding: 8px;
            border-radius: 3px;
            word-break: break-all;
        }
        .message-item.sent {
            background: #e3f2fd;
            color: #1565c0;
        }
        .message-item.received {
            background: #f3e5f5;
            color: #6a1b9a;
        }
        .message-item.event {
            background: #fff3e0;
            color: #e65100;
        }
        .message-item.error {
            background: #ffebee;
            color: #b71c1c;
        }
        .time {
            font-size: 11px;
            opacity: 0.7;
        }
        .clear-btn {
            background: #9E9E9E;
            color: white;
            padding: 8px 16px;
            margin-top: 10px;
            width: 100%;
        }
        .clear-btn:hover {
            background: #757575;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Socket.IO Test Console</h1>
        
        <div class="config-section">
            <label>Server URL (Default: http://localhost:3000)</label>
            <input type="text" id="serverUrl" placeholder="http://localhost:3000 or ngrok URL" value="">

            <label style="margin-top: 10px;">User ID (Required for room subscribe)</label>
            <input type="text" id="userId" placeholder="Example: 1" value="1">
            
            <label style="margin-top: 10px;">Token (Optional)</label>
            <input type="password" id="token" placeholder="Bearer token for authentication">
        </div>

        <div id="status" class="status disconnected">
            <span class="status-dot"></span>
            <span id="statusText">Disconnected</span>
        </div>

        <button class="btn-connect" id="connectBtn" onclick="connect()">Connect</button>
        <button class="btn-disconnect" id="disconnectBtn" onclick="disconnect()" disabled>Disconnect</button>

        <div class="message-section">
            <label>Send Message (Event: 'ping')</label>
            <div class="message-input">
                <input type="text" id="messageInput" placeholder="Enter message..." onkeypress="if(event.key==='Enter') sendMessage()">
                <button class="btn-send" onclick="sendMessage()">Send</button>
            </div>

            <label>Logs</label>
            <div class="messages" id="messages"></div>
            <button class="clear-btn" onclick="clearMessages()">Clear Logs</button>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script>
        let socket = null;
        const NAMESPACE = '/media';
        const SOCKET_PATH = '/socket.io';

        function getServerUrl() {
            const url = document.getElementById('serverUrl').value;
            return url || 'http://localhost:3000';
        }

        function getToken() {
            return document.getElementById('token').value;
        }

        function getUserId() {
            return document.getElementById('userId').value.trim();
        }

        function connect() {
            const serverUrl = getServerUrl();
            const token = getToken();
            const userId = getUserId();

            if (!userId) {
                alert('Please enter userId');
                return;
            }

            const options = {
                path: SOCKET_PATH,
                reconnection: true,
                reconnectionDelay: 1000,
                reconnectionDelayMax: 5000,
                reconnectionAttempts: 5,
                transports: ['websocket'],
                query: {
                    userId: userId
                }
            };

            if (token) {
                options.auth = {
                    token: token.startsWith('Bearer ') ? token : 'Bearer ' + token
                };
            }

            const socketUrl = `${serverUrl}${NAMESPACE}`;
            addMessage(`Connecting to ${socketUrl} (path: ${SOCKET_PATH})...`, 'event');

            socket = io(socketUrl, options);

            socket.on('connect', () => {
                addMessage('✅ Connected! Socket ID: ' + socket.id, 'received');
                socket.emit('ping');
                socket.emit('subscribe:user', { userId });
                updateStatus(true);
                document.getElementById('connectBtn').disabled = true;
                document.getElementById('disconnectBtn').disabled = false;
            });

            socket.on('subscribed', (data) => {
                addMessage('Subscribed: ' + JSON.stringify(data), 'received');
            });

            socket.on('disconnect', () => {
                addMessage('❌ Disconnected', 'event');
                updateStatus(false);
                document.getElementById('connectBtn').disabled = false;
                document.getElementById('disconnectBtn').disabled = true;
            });

            socket.on('connect_error', (error) => {
                addMessage('Connect error: ' + error.message, 'error');
            });

            socket.on('pong', (data) => {
                addMessage('Pong: ' + JSON.stringify(data), 'received');
            });

            // Listen for all events
            socket.onAny((event, ...args) => {
                if (event !== 'connect' && event !== 'disconnect') {
                    addMessage(`Event: ${event} - ${JSON.stringify(args)}`, 'received');
                }
            });
        }

        function disconnect() {
            if (socket) {
                socket.disconnect();
                addMessage('Disconnecting...', 'event');
            }
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();

            if (!message) {
                alert('Please enter a message');
                return;
            }

            if (!socket || !socket.connected) {
                alert('Not connected to server');
                return;
            }

            try {
                socket.emit('ping', { message: message, timestamp: new Date().toISOString() });
                addMessage('Sent ping: ' + message, 'sent');
                input.value = '';
            } catch (error) {
                addMessage('Error sending: ' + error.message, 'error');
            }
        }

        function addMessage(text, type = 'event') {
            const messagesDiv = document.getElementById('messages');
            const messageItem = document.createElement('div');
            messageItem.className = 'message-item ' + type;
            const time = new Date().toLocaleTimeString();
            messageItem.innerHTML = `<span class="time">${time}</span> ${escapeHtml(text)}`;
            messagesDiv.appendChild(messageItem);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function clearMessages() {
            document.getElementById('messages').innerHTML = '';
        }

        function updateStatus(connected) {
            const status = document.getElementById('status');
            const statusText = document.getElementById('statusText');
            if (connected) {
                status.className = 'status connected';
                statusText.textContent = '🟢 Connected';
            } else {
                status.className = 'status disconnected';
                statusText.textContent = '🔴 Disconnected';
            }
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        // Auto-detect server URL from window location
        window.addEventListener('load', () => {
            const protocol = window.location.protocol === 'https:' ? 'https:' : 'http:';
            const host = window.location.host;
            const defaultUrl = `${protocol}//${host}`;
            document.getElementById('serverUrl').value = defaultUrl;
            addMessage('Default server URL set to: ' + defaultUrl, 'event');
        });
    </script>
</body>
</html>
