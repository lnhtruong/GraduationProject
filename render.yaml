      - key: DB_PORT
        value: 3306

      - key: DB_USERNAME
        sync: false

      - key: DB_PASSWORD
        sync: false

      - key: DB_DATABASE
        sync: false

      - key: JWT_SECRET
        value: fivetoneu2026

      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m

      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d



# =================================================
# MAIL SERVICE
# =================================================
  - type: web
    name: mail-service
    env: node
    plan: free
    rootDir: backend_services/mail_service
    buildCommand: yarn install && yarn build
    startCommand: yarn start:prod
    autoDeploy: true

    envVars:

      - key: PORT
        value: 10000

      - key: MAIL_HOST
        value: smtp.gmail.com

      - key: MAIL_PORT
        value: 587

      - key: MAIL_USER
        sync: false

      - key: MAIL_PASS
        sync: false

      - key: MAIL_FROM
        sync: false

      - key: REDIS_HOST
        fromService:
          type: redis
          name: redis-cache
          property: host

      - key: REDIS_PORT
        fromService:
          type: redis
          name: redis-cache
          property: port

      - key: REDIS_PASSWORD
        fromService:
          type: redis
          name: redis-cache
          property: password

      - key: REDIS_DB
        value: 0

      - key: REDIS_TTL
        value: 604800



