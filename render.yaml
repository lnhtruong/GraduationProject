    startCommand: yarn start
    autoDeploy: true

    envVars:

      - key: PORT
        value: 10000

      - key: PAYOS_CLIENT_ID
        sync: false

      - key: PAYOS_API_KEY
        sync: false

      - key: PAYOS_CHECKSUM_KEY
        sync: false

      - key: PAYOS_WEBHOOK_URL
        sync: false

      - key: PAYOS_CANCEL_URL
        sync: false

      - key: PAYOS_RETURN_URL
        sync: false

      - key: REDIS_HOST
        fromService:
          type: redis
          name: redis-cache
          property: host

      - key: REDIS_PORT
        fromService:
          type: redis
          name: redis-cache
          property: port



