    autoDeploy: true

    envVars:

      - key: PORT
        value: 10000

      - key: NODE_ENV
        value: production

      - key: DB_HOST
        sync: false

      - key: DB_PORT
        value: 3306

      - key: DB_USERNAME
        sync: false

      - key: DB_PASSWORD
        sync: false

      - key: DB_DATABASE
        sync: false

      - key: JWT_SECRET
        value: fivetoneu2026

      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m

      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d



